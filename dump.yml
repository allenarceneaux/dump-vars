name: 'Dump variables'
on:
  push:
    branches: aha.test
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
        - name: 'Dump Env and Secrets'
          shell: bash
          run: |
            env > env.txt      
        - name: 'Upload env Artifact'
          uses: actions/upload-artifact@v4
          with:
            name: env
            retention-days: 1
            path: |
              env.txt